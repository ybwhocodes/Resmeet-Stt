version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # 1. MySQL Database Service
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: resmeet_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: stt_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------------------
  # 2. Resmeet-STT Backend (Bun.js + Whisper.cpp + Python Audio Filters)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resmeet_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      NODE_ENV: production
      PORT: 8081
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: stt_db
      DB_USER: root
      DB_PASSWORD: password
      WHISPER_MODEL: large-v3-turbo
      CPU_THREADS: 4
      AI_BASE_URL: http://host.docker.internal:20128/v1
      AI_API_KEY: sk-ff353870199354cb-rvq507-8ef93405
      AI_MODEL_ID: 9R-Gemini
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/models:/app/models
      - ./backend/knowledge:/app/knowledge
      - ./backend/transcripts_md:/app/transcripts_md
      - ./backend/settings.json:/app/settings.json
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ----------------------------------------------------------------------------
  # 3. Resmeet-STT Frontend (React + Vite + Markmap + UI Dashboard)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resmeet_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8081/api

volumes:
  mysql_data:
    name: resmeet_mysql_data
