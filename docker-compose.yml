services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service (Default)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: resmeet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stt_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stt_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------------------
  # 2. Resmeet-STT Backend (Rust Axum + Whisper.cpp + Tokio)
  # ----------------------------------------------------------------------------
  backend:
    image: resmeet-stt-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resmeet_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8200:8200"
    environment:
      RUST_LOG: resmeet_backend=info,tower_http=info
      PORT: 8200
      APP_CONFIG_DIR: /app/config
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: stt_db
      DB_USER: postgres
      DB_PASSWORD: password
      DATABASE_URL: postgres://postgres:password@postgres:5432/stt_db
      DB_SETUP_HOST: postgres
      WHISPER_MODEL: ggml-large-v3-turbo-q5_0.bin
      MODEL_DIR: /app/models
      CPU_THREADS: 4
    volumes:
      - backend_models:/app/models
      - backend_uploads:/app/uploads
      - backend_transcripts_md:/app/transcripts_md
      - backend_config:/app/config

  # ----------------------------------------------------------------------------
  # 3. Resmeet-STT Frontend (React 19 + Vite + Tailwind CSS + Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    image: resmeet-stt-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resmeet_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8200/api

volumes:
  postgres_data:
    name: resmeet_postgres_data
  backend_models:
    name: resmeet_backend_models
    external: true
  backend_uploads:
    name: resmeet_backend_uploads
  backend_transcripts_md:
    name: resmeet_backend_transcripts_md
  backend_config:
    name: resmeet_backend_config
