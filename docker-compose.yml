x-runtime: &runtime
  image: resmeet-stt-backend
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &runtime-env
    RUST_LOG: resmeet_backend=info,tower_http=info
    PORT: 8200
    APP_CONFIG_DIR: /app/config
    DB_HOST: ${DB_HOST:-host.docker.internal}
    DB_PORT: ${DB_PORT:-5433}
    DB_NAME: ${DB_NAME:-stt_db}
    DB_USER: ${DB_USER:-postgres}
    DB_PASSWORD: ${DB_PASSWORD:-password}
    DATABASE_URL: ${DATABASE_URL:-postgres://postgres:password@host.docker.internal:5433/stt_db}
    DB_SETUP_HOST: ${DB_SETUP_HOST:-host.docker.internal}
    WHISPER_MODEL: ggml-large-v3-turbo-q5_0.bin
    MODEL_DIR: /app/models
    CPU_THREADS: ${CPU_THREADS:-6}
    STT_ENGINE: ${STT_ENGINE:-auto}
    STT_BATCH_SIZE: ${STT_BATCH_SIZE:-1}
    STT_CHUNK_SECONDS: ${STT_CHUNK_SECONDS:-45}
    STT_CONCURRENCY: ${STT_CONCURRENCY:-2}
    MODEL_IDLE_SECONDS: ${MODEL_IDLE_SECONDS:-300}
    VAD_ENABLED: ${VAD_ENABLED:-true}
  volumes:
    - ./backend/models:/app/models
    - backend_uploads:/app/uploads
    - backend_transcripts_md:/app/transcripts_md
    - backend_config:/app/config

services:
  backend:
    <<: *runtime
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resmeet_backend
    cpus: ${RESMEET_API_CPU_LIMIT:-0.5}
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    environment:
      <<: *runtime-env
      APP_ROLE: api
    ports:
      - "8200:8200"

  worker:
    <<: *runtime
    container_name: resmeet_worker
    cpus: ${RESMEET_CPU_LIMIT:-4.0}
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    environment:
      <<: *runtime-env
      APP_ROLE: worker
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "resmeet-backend", "--check-worker"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  ai-worker:
    <<: *runtime
    container_name: resmeet_ai_worker
    cpus: ${RESMEET_AI_CPU_LIMIT:-0.5}
    environment:
      <<: *runtime-env
      APP_ROLE: ai-worker
    volumes:
      - backend_config:/app/config
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "resmeet-backend", "--check-worker"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    image: resmeet-stt-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resmeet_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  backend_uploads:
    name: resmeet_backend_uploads
  backend_transcripts_md:
    name: resmeet_backend_transcripts_md
  backend_config:
    name: resmeet_backend_config
