<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="gradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>

  <!-- Symbol C: Speech-to-Text conversion ribbon -->
  <g id="symbol-c" transform="translate(45, 25)">
    <!-- Base geometric shield / doc badge -->
    <rect x="25" y="15" width="150" height="150" rx="36" fill="#18181B" />

    <!-- Left side: 3 audio waves (Speech) -->
    <path d="M 52 75 C 52 65, 52 115, 52 105" stroke="#A78BFA" stroke-width="8" stroke-linecap="round" />
    <path d="M 68 62 C 68 45, 68 135, 68 118" stroke="#C084FC" stroke-width="8" stroke-linecap="round" />
    <path d="M 84 48 C 84 35, 84 145, 84 132" stroke="#E879F9" stroke-width="8" stroke-linecap="round" />

    <!-- Center divider / transformation spark -->
    <circle cx="106" cy="90" r="5" fill="#F43F5E" />

    <!-- Right side: Clean structured text lines (Text) -->
    <rect x="122" y="60" width="34" height="8" rx="4" fill="#FFFFFF" />
    <rect x="122" y="78" width="28" height="8" rx="4" fill="#FFFFFF" />
    <rect x="122" y="96" width="36" height="8" rx="4" fill="#E879F9" />
    <rect x="122" y="114" width="20" height="8" rx="4" fill="#A78BFA" />
  </g>

  <!-- Wordmark C -->
  <g id="wordmark-c" transform="translate(250, 75)">
    <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="800" fill="#09090B" letter-spacing="-1.5">
      Res<tspan fill="#8B5CF6">meet</tspan>
    </text>
    <text x="4" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#71717A" letter-spacing="3.5">
      REALTIME SPEECH RECOGNITION
    </text>
  </g>
</svg>