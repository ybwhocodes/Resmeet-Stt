<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <!-- Symbol Pure Black -->
  <g id="symbol-mono-black" transform="translate(40, 40)">
    <!-- Outline/Inverted style or solid badge with cutout lines -->
    <rect x="0" y="0" width="160" height="160" rx="40" fill="#000000" />
    <line x1="36" y1="64" x2="36" y2="96" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    <line x1="52" y1="48" x2="52" y2="112" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    <line x1="68" y1="36" x2="68" y2="124" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    <circle cx="85" cy="80" r="5" fill="#FFFFFF" />
    <rect x="98" y="52" width="38" height="8" rx="4" fill="#FFFFFF" />
    <rect x="98" y="70" width="30" height="8" rx="4" fill="#FFFFFF" />
    <rect x="98" y="88" width="40" height="8" rx="4" fill="#FFFFFF" />
    <rect x="98" y="106" width="22" height="8" rx="4" fill="#FFFFFF" />
