<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <!-- Dark test canvas background for inspection -->
  <rect width="100%" height="100%" fill="#09090B" />

  <!-- Symbol Reversed White with optical reduction (~5%) -->
  <g id="symbol-mono-white" transform="translate(40, 40)">
    <rect x="0" y="0" width="160" height="160" rx="40" fill="#27272A" stroke="#FFFFFF" stroke-width="2" />
    <line x1="36" y1="64" x2="36" y2="96" stroke="#FFFFFF" stroke-width="7.6" stroke-linecap="round" />
    <line x1="52" y1="48" x2="52" y2="112" stroke="#FFFFFF" stroke-width="7.6" stroke-linecap="round" />
    <line x1="68" y1="36" x2="68" y2="124" stroke="#FFFFFF" stroke-width="7.6" stroke-linecap="round" />
    <circle cx="85" cy="80" r="4.8" fill="#FFFFFF" />
    <rect x="98" y="52" width="38" height="7.6" rx="3.8" fill="#FFFFFF" />
    <rect x="98" y="70" width="30" height="7.6" rx="3.8" fill="#FFFFFF" />
    <rect x="98" y="88" width="40" height="7.6" rx="3.8" fill="#FFFFFF" />
    <rect x="98" y="106" width="22" height="7.6" rx="3.8" fill="#FFFFFF" />
  </g>

  <!-- Wordmark Pure White -->
  <g id="wordmark-mono-white" transform="translate(240, 75)">
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-2">
      Resmeet
    </text>
    <text x="4" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#A1A1AA" letter-spacing="4">
      SPEECH-TO-TEXT INTELLIGENCE
    </text>
  </g>
</svg>