<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="appBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- Accent Inner Shadow / Glow -->
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#appBgGrad)" />
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#glow)" />
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3" />

  <!-- Inner Symbol Structure -->
  <g transform="translate(100, 100)">
    <!-- Audio waves -->
    <line x1="40" y1="126" x2="40" y2="186" stroke="#A78BFA" stroke-width="16" stroke-linecap="round" />
    <line x1="72" y1="94" x2="72" y2="218" stroke="#C084FC" stroke-width="16" stroke-linecap="round" />
    <line x1="104" y1="68" x2="104" y2="244" stroke="#E879F9" stroke-width="16" stroke-linecap="round" />

    <!-- Core AI Hub Node -->
    <circle cx="140" cy="156" r="11" fill="#F43F5E" />

    <!-- Transcript Lines -->
    <rect x="166" y="98" width="76" height="16" rx="8" fill="#FFFFFF" />
    <rect x="166" y="134" width="60" height="16" rx="8" fill="#FFFFFF" />
    <rect x="166" y="170" width="80" height="16" rx="8" fill="#E879F9" />
    <rect x="166" y="206" width="44" height="16" rx="8" fill="#A78BFA" />
  </g>
</svg>