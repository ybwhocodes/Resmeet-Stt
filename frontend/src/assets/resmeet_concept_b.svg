<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="gradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Symbol B: Dual meeting bubbles with central voice/text bridge -->
  <g id="symbol-b" transform="translate(45, 20)">
    <!-- Primary Speech Bubble -->
    <path d="M 30 50 C 30 32, 46 18, 70 18 L 120 18 C 144 18, 160 32, 160 50 L 160 110 C 160 128, 144 142, 120 142 L 75 142 L 45 168 L 50 142 C 38 138, 30 126, 30 110 Z"
          fill="#0F172A" />

    <!-- Waveform equalizer converting voice inside bubble -->
    <rect x="58" y="70" width="8" height="24" rx="4" fill="#38BDF8" />
    <rect x="74" y="52" width="8" height="58" rx="4" fill="#38BDF8" />
    <rect x="90" y="42" width="8" height="78" rx="4" fill="#10B981" />
    <rect x="106" y="58" width="8" height="46" rx="4" fill="#10B981" />
    <rect x="122" y="72" width="8" height="20" rx="4" fill="#38BDF8" />

    <!-- Secondary small quote / transcript mark -->
    <circle cx="156" cy="146" r="14" fill="#10B981" />
    <path d="M 152 146 L 160 146 M 152 150 L 158 150" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Wordmark B -->
  <g id="wordmark-b" transform="translate(250, 75)">
    <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="800" fill="#0F172A" letter-spacing="-1.5">
      Res<tspan fill="#0284C7">meet</tspan>
    </text>
    <text x="4" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#64748B" letter-spacing="3.5">
      MEETING AUDIO TO TEXT PLATFORM
    </text>
  </g>
</svg>