server {
    listen 5173;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;

    # index.html selalu divalidasi ulang agar browser tidak memakai bundle lama setelah rebuild.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Aset ber-hash dari Vite aman di-cache lama.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Aset statis lain (favicon, logo, dll) tidak boleh jatuh ke index.html.
    location ~* \.(svg|png|jpg|jpeg|gif|ico|webp|css|js|map)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
