server {
    listen 5173;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;
    client_max_body_size 1024m;

    location /api/ {
        proxy_pass http://backend:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /socket.io/ {
        proxy_pass http://backend:8200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # index.html selalu divalidasi ulang agar browser tidak memakai bundle lama setelah rebuild.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Aset ber-hash dari Vite aman di-cache lama.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Aset statis lain (favicon, logo, dll) tidak boleh jatuh ke index.html.
    location ~* \.(svg|png|jpg|jpeg|gif|ico|webp|css|js|map)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
